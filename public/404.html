<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        --bg: #0b0b0d;
        --bg-soft: #141311;
        --text: #ece6d8;
        --text-dim: #b0a894;
        --gold: #d99a2c;
        --gold-soft: #ffb833;
        --line: rgba(255, 255, 255, 0.12);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Work Sans', sans-serif;
        min-height: 100vh;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
      }
      .brand {
        font-family: 'Big Shoulders Display', sans-serif;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-decoration: none;
        color: var(--text);
        margin-bottom: 24px;
        transition: opacity 0.2s;
      }
      .brand:hover { opacity: 0.85; }
      .brand span { color: var(--gold); }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid var(--gold);
        padding: 6px 14px;
        border-radius: 2px;
        margin-bottom: 16px;
      }
      .code {
        font-family: 'Big Shoulders Display', sans-serif;
        font-size: clamp(80px, 18vw, 160px);
        font-weight: 900;
        line-height: 0.85;
        letter-spacing: 0.05em;
        color: var(--text);
        margin-bottom: 12px;
      }
      .code span { color: var(--gold); }
      h1 {
        font-family: 'Big Shoulders Display', sans-serif;
        font-size: clamp(28px, 4.5vw, 44px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      p {
        max-width: 480px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-dim);
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 14px 28px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        transition: transform 0.2s, background 0.2s;
      }
      .btn-gold { background: var(--gold); color: #0b0b0d; }
      .btn-gold:hover { background: var(--gold-soft); transform: translateY(-2px); }
      .btn-outline { border: 1px solid var(--line); color: var(--text); }
      .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <a href="/" class="brand">STEEZE<span>DRIP</span></a>

    <div class="actions">

    </div>
  </body>
</html>
