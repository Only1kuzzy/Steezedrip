<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>404 — Drop Not Found | SteezeDrip</title>
    <meta name="description" content="The page or piece you are looking for is unavailable or has been archived. Return to SteezeDrip." />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="canonical" href="https://steezedrips.com/404" />
    <style>
      :root {
        --bg: #0b0b0d;
        --card: #151518;
        --accent: #d4a373;
        --text: #f4ede4;
        --muted: #8b8882;
        --line: rgba(212, 163, 115, 0.18);
        --font-serif: "Cinzel", Georgia, serif;
        --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid var(--line);
        background: rgba(212, 163, 115, 0.08);
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 20px;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(3rem, 10vw, 7rem);
        letter-spacing: 0.06em;
        line-height: 1;
        margin-bottom: 12px;
        color: var(--text);
      }
      h2 {
        font-size: clamp(1.2rem, 3vw, 1.75rem);
        font-weight: 500;
        margin-bottom: 16px;
        letter-spacing: 0.04em;
      }
      p {
        color: var(--muted);
        max-width: 460px;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 auto 32px auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--text);
        color: var(--bg);
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: var(--accent);
        transform: translateY(-2px);
      }
      .footer-note {
        margin-top: 48px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <span class="badge">Archive Notice</span>
    <h1>404</h1>
    <h2>DROP NOT FOUND</h2>
    <p>The piece or directory you are looking for has been sold out, moved to the private archive, or does not exist.</p>
    <a href="/" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Return to Storefront
    </a>
    <div class="footer-note">SteezeDrip — Lagos-Rooted, World-Bound</div>
  </body>
</html>
